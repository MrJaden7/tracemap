name: tracemap
version: 0.1.0
config-version: 2
profile: tracemap

model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: target
clean-targets:
  - target
  - dbt_packages

models:
  tracemap:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    cdm:
      +materialized: table
      +schema: cdm
    etl_meta:
      +materialized: table
      +schema: etl_meta

seeds:
  tracemap:
    +schema: etl_meta
