# GENERATED by tracemap generate. Do not edit by hand.
version: 2
models:
- name: care_site
  description: One row per Synthea organization. The place_of_service_concept_id is left null in Phase
    1 because Synthea's organization records have no service type field; in Phase 2 this will be inferred
    from the encounter classes seen at each organization.
  columns:
  - name: care_site_id
    tests:
    - not_null
    - unique
  - name: care_site_name
  - name: place_of_service_concept_id
  - name: location_id
  - name: care_site_source_value
  - name: place_of_service_source_value
- name: cdm_source
  description: One-row table describing the source dataset that produced this CDM instance. All values
    are constants or derived at build time by the intermediate layer, not from a source CSV column.
  columns:
  - name: cdm_source_name
    tests:
    - not_null
  - name: cdm_source_abbreviation
    tests:
    - not_null
  - name: cdm_holder
    tests:
    - not_null
  - name: source_description
  - name: source_documentation_reference
  - name: cdm_etl_reference
  - name: source_release_date
    description: MAX(START) across Synthea events on the run, computed at build time.
    tests:
    - not_null
  - name: cdm_release_date
    description: cdm_run.finished_at, computed at build time.
    tests:
    - not_null
  - name: cdm_version
  - name: cdm_version_concept_id
    tests:
    - not_null
  - name: vocabulary_version
    description: cdm_run.vocabulary_version, computed at build time.
    tests:
    - not_null
- name: condition_occurrence
  description: One row per Synthea condition record. Codes are SNOMED. Mapping a SNOMED code to its standard
    concept via `Maps to` may land the row in the Procedure or Observation domain; when it does, domain
    routing in the intermediate layer moves the row to procedure_occurrence or observation rather than
    forcing it here.
  columns:
  - name: condition_occurrence_id
    tests:
    - not_null
    - unique
  - name: person_id
    tests:
    - not_null
  - name: condition_concept_id
    tests:
    - not_null
  - name: condition_start_date
    tests:
    - not_null
  - name: condition_start_datetime
  - name: condition_end_date
  - name: condition_end_datetime
  - name: condition_type_concept_id
    description: Synthea is an EHR-style export.
    tests:
    - not_null
  - name: condition_source_value
  - name: condition_source_concept_id
  - name: visit_occurrence_id
- name: death
  description: One row per deceased Synthea patient. Taken from patients.deathdate when non-null. Plausibility
    (no clinical events after death beyond a small tolerance) is a data quality test, not a mapping rule.
  columns:
  - name: person_id
    tests:
    - not_null
  - name: death_date
    tests:
    - not_null
  - name: death_datetime
  - name: death_type_concept_id
- name: drug_exposure
  description: One row per Synthea medication record. Synthea codes drugs in RxNorm, which OMOP treats
    as a standard vocabulary, so the standard concept mapping is effectively a pass-through that only
    fills in the correct concept_id.
  columns:
  - name: drug_exposure_id
    tests:
    - not_null
    - unique
  - name: person_id
    tests:
    - not_null
  - name: drug_concept_id
    tests:
    - not_null
  - name: drug_exposure_start_date
    tests:
    - not_null
  - name: drug_exposure_start_datetime
  - name: drug_exposure_end_date
    tests:
    - not_null
  - name: drug_exposure_end_datetime
  - name: verbatim_end_date
  - name: drug_type_concept_id
    description: Synthea medications come from an EHR-style export.
    tests:
    - not_null
  - name: drug_source_value
  - name: drug_source_concept_id
  - name: visit_occurrence_id
- name: location
  description: One row per distinct (address, city, state, zip) tuple across patients and organizations.
    De-duplication happens in the intermediate layer so multiple patients at the same address point at
    one location row.
  columns:
  - name: location_id
    description: Generated by the intermediate layer via row_number() over distinct addresses.
    tests:
    - not_null
    - unique
  - name: address_1
  - name: city
  - name: state
  - name: zip
  - name: county
  - name: location_source_value
    description: Synthea FIPS county code kept as source value.
- name: measurement
  description: Synthea observations with category laboratory or vital-signs become measurements. Other
    observation categories route to the observation table. Codes are LOINC, units are mapped to UCUM.
    Numeric values populate value_as_number; non-numeric results are mapped to a value_as_concept_id where
    a mapping exists.
  columns:
  - name: measurement_id
    tests:
    - not_null
    - unique
  - name: person_id
    tests:
    - not_null
  - name: measurement_concept_id
    tests:
    - not_null
  - name: measurement_date
    tests:
    - not_null
  - name: measurement_datetime
  - name: measurement_type_concept_id
    tests:
    - not_null
  - name: value_as_number
    description: Only when type = 'numeric'; non-numeric rows leave this null.
  - name: value_as_concept_id
    description: Only when type != 'numeric'.
  - name: unit_concept_id
  - name: unit_source_value
  - name: measurement_source_value
  - name: measurement_source_concept_id
  - name: value_source_value
  - name: visit_occurrence_id
- name: metadata
  description: Free-form metadata about the CDM build. Populated at build time with the ETL version, Synthea
    version and seed, vocabulary version and the mapping spec version. All values are derived from etl_meta.cdm_run
    at build time; there is no source CSV.
  columns:
  - name: metadata_id
    tests:
    - not_null
    - unique
  - name: metadata_concept_id
    tests:
    - not_null
  - name: metadata_type_concept_id
    tests:
    - not_null
  - name: name
    description: etl_version, synthea_version, synthea_seed, vocabulary_version, spec_version.
    tests:
    - not_null
  - name: value_as_string
  - name: metadata_date
- name: observation
  description: Synthea observations that are not laboratory or vital-signs become OMOP observations (survey,
    social-history, exam, therapy, procedure, imaging). Also receives Synthea conditions and procedures
    whose SNOMED standard concept is in the Observation domain via domain routing.
  columns:
  - name: observation_id
    tests:
    - not_null
    - unique
  - name: person_id
    tests:
    - not_null
  - name: observation_concept_id
    tests:
    - not_null
  - name: observation_date
    tests:
    - not_null
  - name: observation_datetime
  - name: observation_type_concept_id
    tests:
    - not_null
  - name: value_as_number
  - name: value_as_string
  - name: value_as_concept_id
  - name: unit_concept_id
  - name: unit_source_value
  - name: observation_source_value
  - name: observation_source_concept_id
  - name: visit_occurrence_id
- name: observation_period
  description: 'One row per patient covering the full span of observed events. Computed in the intermediate
    layer as MIN(event_date) to MAX(event_date) across every clinical event table (encounters, conditions,
    medications, observations, procedures, immunizations, allergies). The rule is intentionally simple:
    Synthea generates continuous records per patient, so a single period per person is correct.'
  columns:
  - name: observation_period_id
    tests:
    - not_null
    - unique
  - name: person_id
    tests:
    - not_null
  - name: observation_period_start_date
    description: Computed in the intermediate layer, not from a source column.
    tests:
    - not_null
  - name: observation_period_end_date
    description: Computed in the intermediate layer, not from a source column.
    tests:
    - not_null
  - name: period_type_concept_id
    description: Verified against vocab.concept at build time.
    tests:
    - not_null
- name: person
  description: One row per distinct source patient. Synthea patients are keyed by UUID, which is mapped
    to the integer person_id via etl_meta.person_key_map. Race and ethnicity are stored as source_value
    only in Phase 1 (Synthea categories are US-specific and do not match UK ethnicity coding; a mapping
    table is out of scope).
  columns:
  - name: person_id
    description: Synthea UUID mapped to integer person_id.
    tests:
    - not_null
    - unique
  - name: gender_concept_id
    description: Synthea values M and F map to Gender concepts 8507 and 8532.
    tests:
    - not_null
  - name: year_of_birth
    description: Year extracted from birthdate (YYYY-MM-DD).
    tests:
    - not_null
  - name: month_of_birth
  - name: day_of_birth
  - name: birth_datetime
  - name: race_concept_id
    description: Synthea race categories are US-specific; left unmapped in Phase 1.
    tests:
    - not_null
  - name: ethnicity_concept_id
    description: Synthea ethnicity values are US-specific.
    tests:
    - not_null
  - name: person_source_value
  - name: gender_source_value
  - name: race_source_value
  - name: ethnicity_source_value
- name: procedure_occurrence
  description: One row per Synthea procedure record. Codes are SNOMED. Conditions and observations may
    also route here when the standard concept lands in the Procedure domain (domain routing, implemented
    in the intermediate layer).
  columns:
  - name: procedure_occurrence_id
    tests:
    - not_null
    - unique
  - name: person_id
    tests:
    - not_null
  - name: procedure_concept_id
    tests:
    - not_null
  - name: procedure_date
    tests:
    - not_null
  - name: procedure_datetime
  - name: procedure_end_date
  - name: procedure_end_datetime
  - name: procedure_type_concept_id
    tests:
    - not_null
  - name: procedure_source_value
  - name: procedure_source_concept_id
  - name: visit_occurrence_id
- name: provider
  description: One row per Synthea provider. Speciality is a free text in Synthea; a mapping to Provider
    speciality concepts is out of scope for Phase 1.
  columns:
  - name: provider_id
    tests:
    - not_null
    - unique
  - name: provider_name
  - name: gender_concept_id
  - name: specialty_concept_id
    description: Synthea speciality strings are not mapped in Phase 1.
  - name: care_site_id
  - name: provider_source_value
  - name: specialty_source_value
  - name: gender_source_value
- name: visit_occurrence
  description: One row per Synthea encounter. Encounter class strings (inpatient, outpatient, emergency
    and others) are mapped to Visit concepts in the intermediate layer via a reference table. The reasoning
    for each choice is recorded there and in ADR 0008.
  columns:
  - name: visit_occurrence_id
    description: Deterministic surrogate key, source row number, so a rerun yields identical ids.
    tests:
    - not_null
    - unique
  - name: person_id
    tests:
    - not_null
  - name: visit_concept_id
    description: inpatient->9201, outpatient->9202, emergency->9203, others documented in table.
    tests:
    - not_null
  - name: visit_start_date
    tests:
    - not_null
  - name: visit_start_datetime
  - name: visit_end_date
    tests:
    - not_null
  - name: visit_end_datetime
  - name: visit_type_concept_id
    description: Synthea is generated as an EHR-style extract.
    tests:
    - not_null
  - name: care_site_id
  - name: provider_id
  - name: visit_source_value
  - name: visit_source_concept_id
