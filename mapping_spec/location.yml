target_table: location
spec_version: 0.1.0
description: >
  One row per distinct (address, city, state, zip) tuple across patients and
  organizations. De-duplication happens in the intermediate layer so multiple
  patients at the same address point at one location row.

sources:
  - source_system: synthea
    source_table: raw.synthea_patients
    grain: one row per distinct address
    fields:
      - target: location_id
        rule: cast_int
        from: _derived_location_id
        notes: Generated by the intermediate layer via row_number() over distinct addresses.

      - target: address_1
        rule: copy
        from: address

      - target: city
        rule: copy
        from: city

      - target: state
        rule: copy
        from: state

      - target: zip
        rule: copy
        from: zip

      - target: county
        rule: copy
        from: county

      - target: location_source_value
        rule: copy
        from: fips
        notes: Synthea FIPS county code kept as source value.
