target_table: cdm_source
spec_version: 0.1.0
description: >
  One-row table describing the source dataset that produced this CDM instance. All
  values are constants or derived at build time by the intermediate layer, not from a
  source CSV column.

sources:
  - source_system: tracemap
    source_table: etl_meta.cdm_run
    grain: one row per CDM build
    fields:
      - target: cdm_source_name
        rule: constant
        value: TraceMap synthetic Synthea dataset

      - target: cdm_source_abbreviation
        rule: constant
        value: TRACEMAP

      - target: cdm_holder
        rule: constant
        value: Jaden Menezes

      - target: source_description
        rule: constant
        value: >-
          Synthea synthetic patient records (US, Massachusetts), mapped to OMOP CDM
          v5.4 by TraceMap. Synthetic data only.

      - target: source_documentation_reference
        rule: constant
        value: https://github.com/synthetichealth/synthea

      - target: cdm_etl_reference
        rule: constant
        value: >-
          Generated by TraceMap. See docs/decisions/ for architectural decision records.

      - target: source_release_date
        rule: copy
        from: __derived_source_release_date__
        notes: MAX(START) across Synthea events on the run, computed at build time.

      - target: cdm_release_date
        rule: copy
        from: __derived_cdm_release_date__
        notes: cdm_run.finished_at, computed at build time.

      - target: cdm_version
        rule: constant
        value: v5.4

      - target: cdm_version_concept_id
        rule: constant
        value: 756265
        label: OMOP CDM v5.4

      - target: vocabulary_version
        rule: copy
        from: __derived_vocabulary_version__
        notes: cdm_run.vocabulary_version, computed at build time.
