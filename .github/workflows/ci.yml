name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Ruff
        run: uv run ruff check src tests
      - name: Ruff format
        run: uv run ruff format --check src tests
      - name: Unit tests
        run: uv run pytest -q

  integration:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tracemap
          POSTGRES_USER: tracemap
          POSTGRES_PASSWORD: tracemap
        ports: ['5440:5432']
        options: >-
          --health-cmd "pg_isready -U tracemap -d tracemap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TRACEMAP_DB_HOST: localhost
      TRACEMAP_DB_PORT: 5440
      TRACEMAP_DB_NAME: tracemap
      TRACEMAP_DB_USER: tracemap
      TRACEMAP_DB_PASSWORD: tracemap
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install
        run: uv sync
      - name: Create test DB
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=tracemap psql -h localhost -p 5440 -U tracemap -d postgres -c "CREATE DATABASE tracemap_test"
      - name: Initialise schemas
        run: uv run tracemap db init
      - name: Load fixture vocabulary
        run: uv run tracemap vocab load --path tests/fixtures/vocab
      - name: Run all pytest tests
        run: uv run pytest -q
